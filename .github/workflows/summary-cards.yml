name: Profile Summary Cards

on:
  schedule:
    - cron: "5 13 * * *"   # ~10:05 BRT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: VieiraGabrielAlexandre
          BRANCH_NAME: main
          OUTPUT_PATH: .
          UTC_OFFSET: -3
          AUTO_PUSH: true
          EXCLUDE: ""
          THEME: dracula
